# =====================================================================
# C1 — SEAM SWEEP (PRIMARY) : segment-size k = 2 .. 16   (S = 256 .. 32)
# ---------------------------------------------------------------------
# Purpose: is seam count the lever?  Does the ~4x over-amplification die
# as S → 1?  All else = fig-1 baseline (corrected).
#
# One group per k because --save-every MUST be a multiple of
# --segment-size (solver hard-errors on unaligned snap steps) — the
# sweeper cross-products lists, it cannot zip save-every to k, so the
# pairing is done here group-by-group.  save-every = max(k, 4) keeps
# every group's frames a subset of the FTCS ref cadence (save-every=4).
#
# k >= 32 is NOT simulable at shots>0: fully deferred k=32 needs 42
# qubits (70 TB); capping smaller trips mid-circuit reset, which knocks
# Aer off its sample-once path — wall-clock goes ~linear in shots (a
# TIME wall, not memory; HANDOFF "Fast vs slow Aer path").  Reach S→1
# via C5 hardware or by extrapolating the S=256→32 trend.
# --max-total-qubits 26 (= q+2+max k) keeps all four k fully
# deferred/fast.  Segment 1 prints `fast path` / `SLOW PATH ...` — if
# you see SLOW PATH, kill the job.
#
# EC2: run from the workspace root (paths below are cwd-relative):
#   q8020-sweep cases/c1_seam_sweep.toml
# =====================================================================

[global]
_output_dir = "~/q8020-runs/ch_q8_c1"
_inject_outdir = "--outdir"
_env = "./q8020-cfd-ch-lbm/.venv"
_script = "python ./q8020-cfd-ch-lbm/src/burgers_solver.py"

_run_mode = "parallel"             # all 4 k-groups launch concurrently (local Popen)
_trials = 1
# No _slurm block / walltime / _case_timeout on EC2 — cases run until
# done; kill a stuck one by hand (each writes pipeline_std{out,err}.txt).
_env_exports = { OMP_NUM_THREADS = "2" }   # Aer threads per case: ~vCPUs / 4 concurrent cases

"--noshow" = true
"--no-classical-reference" = true
"--no-analytic-reference" = true

# Fig-1 op point (corrected) — everything except the swept lever.
"--bc" = "periodic"
"--ic" = "sine"
"--source" = "none"
"--ic-amplitude" = 0.3
"--nu" = 0.03
"--cfl" = 0.1

"--seed" = 1234
"--shots" = 131072                 # 2^17
"--metric-transpile-timeout" = 0

"--q" = 8
"--n-steps" = 512                  # power of 2 -> every k below divides evenly

"--method" = "cole_hopf_circuit"
"--evolution-mode" = "measure_reprepare"
"--bond-dim" = 4                   # PINNED: exact for this phi (1-fid ~4e-8)
"--phi-modes" = 8                  # baseline, held fixed here
"--max-total-qubits" = 26          # q(8)+n_bond(2)+max k(16): keeps ALL k in group fast
# NOTE: no "--propagator" line — flag removed; qft-diagonal is the only path.

# ---------------------------------------------------------------------
# THE swept lever, one group per k (save-every zipped by hand).
# k >= 32 omitted — infeasible at shots>0 (see header).

[seam_k2]                          # S = 256
"--segment-size" = 2
"--save-every" = 4                 # multiple of k=2, keeps ref-frame parity

[seam_k4]                          # S = 128  (paper-like anchor)
"--segment-size" = 4
"--save-every" = 4

[seam_k8]                          # S = 64
"--segment-size" = 8
"--save-every" = 8

[seam_k16]                         # S = 32
"--segment-size" = 16
"--save-every" = 16
