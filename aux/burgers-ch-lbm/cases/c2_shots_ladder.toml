# =====================================================================
# C2 — SHOTS LADDER × k : shots = 2^14 .. 2^20 at fixed segment-size
# ---------------------------------------------------------------------
# Purpose: split per-seam shot noise (error ∝ 1/√shots, S seams compound)
# from the truncation floor (flat bias).  KEEP the low end (16384) — it
# anchors the 1/√shots fit; without it the fit can't separate slope
# from floor.
#
# One TOML per k (handoff rule).  This file is parameterized on _k so
# the SAME file serves both required k values:
#
#   k = 4 (paper-like anchor, the default):
#     q8020-sweep c2_shots_ladder.toml \
#         --set _output_dir=/lustre/orion/ard189/scratch/$USER/ch_q8_c2_k4
#
#   k = k* (the C1 winner — rerun once C1 is scored):
#     q8020-sweep c2_shots_ladder.toml --set _k=<kstar> \
#         --set _output_dir=/lustre/orion/ard189/scratch/$USER/ch_q8_c2_kstar
#
# _k feeds BOTH --segment-size and --save-every (must stay equal/aligned:
# solver hard-errors if snap steps don't land on seams).
# =====================================================================

[global]
_output_dir = "/lustre/orion/ard189/scratch/ishangore/ch-lbm/ch_q8_c2_k4"
_inject_outdir = "--outdir"
_env = "./q8020-cfd-ch-lbm/.venv"
_script = "python ./q8020-cfd-ch-lbm/src/burgers_solver.py"

_slurm = true
_slurm_project = "ard189"
_slurm_pack_venvs = ["./q8020-cfd-ch-lbm/.venv"]
_slurm_partition = "extended"
_slurm_walltime = "24:00:00"
_slurm_cores_per_task = 1
_slurm_cores_per_node = 64
_slurm_exclusive_node = false
_run_mode = "parallel"
_trials = 1
_case_timeout = 82800   # 23 hours; leaves 1h margin

_k = 4                             # steps per segment; override with --set _k=<kstar>

"--noshow" = true
"--no-classical-reference" = true
"--no-analytic-reference" = true

# Fig-1 op point (corrected) — everything except the swept lever.
"--bc" = "periodic"
"--ic" = "sine"
"--source" = "none"
"--ic-amplitude" = 0.3
"--nu" = 0.03
"--cfl" = 0.1

"--seed" = 1234
"--metric-transpile-timeout" = 0

"--q" = 8
"--n-steps" = 512

"--method" = "cole_hopf_circuit"
"--evolution-mode" = "measure_reprepare"
"--segment-size" = "${_k}"
"--save-every" = "${_k}"           # frames land on seams
"--bond-dim" = 4                   # PINNED: exact for this phi (1-fid ~4e-8)
"--phi-modes" = 8                  # baseline, held fixed here
# NOTE: no "--propagator" line — flag removed; qft-diagonal is the only path.

# ---------------------------------------------------------------------
[ch_shots_ladder]
#              2^14   2^16    2^17    2^19    2^20
"--shots" = [16384, 65536, 131072, 524288, 1048576]   # THE swept lever
