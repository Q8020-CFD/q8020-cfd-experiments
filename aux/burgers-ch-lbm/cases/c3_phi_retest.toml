# =====================================================================
# C3 — PHI RE-TEST AT BEST k : phi-modes = [0, 8, 32, 128]
# ---------------------------------------------------------------------
# Purpose: does the Fourier low-pass filter help once seams are
# optimized?  phi=0 (filter OFF) has never been tried.  Priors killed
# phi as a lever only at high seam count (S=80) — it may wake up once
# seams stop dominating.
#
# RUN AFTER C1: set _k to the C1 winner k* (≤ 16 by construction).
# Run from the workspace root (paths below are cwd-relative):
#
#   q8020-sweep q8020-cfd-experiments/aux/burgers-ch-lbm/cases/c3_phi_retest.toml --set _k=<kstar> --set _mtq=<10+kstar>
#
# shots stays 2^17 (q8 diagnosis level — see HANDOFF "Shots per q").
#
# FAST-PATH GATE: _mtq = q + 2 + k* keeps the run on Aer's sample-once
# path (HANDOFF "Fast vs slow Aer path").  Segment 1 prints `fast path`
# / `SLOW PATH ...` — if you see SLOW PATH, kill it.
# =====================================================================

[global]
_output_dir = "~/q8020-runs/ch_q8_c3"
_inject_outdir = "--outdir"
_env = "./q8020-cfd-ch-lbm/.venv"
_script = "python ./q8020-cfd-ch-lbm/src/burgers_solver.py"

_run_mode = "parallel"             # all 4 phi values launch concurrently (local Popen)
_trials = 1
# No _slurm block / walltime / _case_timeout on EC2 — cases run until
# done; kill a stuck one by hand (each writes pipeline_std{out,err}.txt).
_env_exports = { OMP_NUM_THREADS = "2" }   # Aer threads per case: ~vCPUs / 4 concurrent cases

_k = 4                             # PLACEHOLDER — override with --set _k=<kstar>
_mtq = 14                          # = q+2+_k; override alongside _k (TOML can't do math)

"--noshow" = true
"--no-classical-reference" = true
"--no-analytic-reference" = true

# Fig-1 op point (corrected) — everything except the swept lever.
"--bc" = "periodic"
"--ic" = "sine"
"--source" = "none"
"--ic-amplitude" = 0.3
"--nu" = 0.03
"--cfl" = 0.1

"--seed" = 1234
"--shots" = 131072                 # 2^17
"--metric-transpile-timeout" = 0

"--q" = 8
"--n-steps" = 512

"--method" = "cole_hopf_circuit"
"--evolution-mode" = "measure_reprepare"
"--segment-size" = "${_k}"
"--save-every" = "${_k}"           # frames land on seams
"--max-total-qubits" = "${_mtq}"   # fast-path gate: q+2+k* — see header
"--bond-dim" = 4                   # PINNED: exact for this phi (1-fid ~4e-8)
# NOTE: no "--propagator" line — flag removed; qft-diagonal is the only path.

# ---------------------------------------------------------------------
[ch_phi_retest]
"--phi-modes" = [0, 8, 32, 128]    # THE swept lever (0 = filter off, never tried)
