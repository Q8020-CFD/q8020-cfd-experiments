# Exact-statevector HHL at nelem=3 and nelem=4 (2 cases), on the same newest-package stack as fvm_main_latestpkgs.toml.
#
# Why: Fig 5 of the AIAA27 QCFD paper shows HHL (ideal) vs LU at Nelem = 3, 4, 5. HHL results exist only for nelem 5
# in this workspace (the classical LU references for nelem 3/4 live in fvm_euler_1d_solver/post_process/ref_sol/).
# Exact case = shots 0, deterministic, so one case per mesh, no trials.
#
# Same code, packages, HHL library and solver flags as fvm_main_latestpkgs.toml (fvm ef7f0a8b, qiskit 2.6.2,
# quantum_linear_solvers@99231b8, Python 3.12); only -nelem changes. No transpiler optimization level is set.
#
# Run from the workspace root (all paths are cwd-relative); same worktree/venv as the original sweep (see README.md):
#   q8020-sweep q8020-cfd-experiments/results/fvm_euler_1d_solver/nov2025-rerun/latest_pkgs/fvm_main_latestpkgs_nelem34.toml --dry-run
#   # expect "2 cases in 1 groups"
#   q8020-sweep <this toml>
#
[global]
_output_dir = "/lustre/orion/ard189/proj-shared/ishangore/nov2025-rerun/latest_pkgs_nelem34"

# --- Paths (override with --set for different layouts) ---
_solver_dir = "./fvm_euler_1d_solver-main-latestpkgs"
_harvester_dir = "./q8020-cfd-experiments-aux/fvm_euler_1d_nozzle/fvm_euler_1d_nozzle"
_postproc_venv = "./fvm_euler_1d_solver-main-latestpkgs/.venv"

# --- SLURM ---
# Cases are single-core; pack 56 per node (2 cases -> 1 node).
# new_pkgs cases took ~1.5 h; same walltime budget here.
_slurm = true
_run_mode = "parallel"
_slurm_project = "ard189"
_slurm_partition = "extended"
_slurm_walltime = "08:00:00"
_slurm_exclusive_node = false
_slurm_cores_per_task = 1
_slurm_cores_per_node = 56
_slurm_pack_venvs = ["${_solver_dir}/.venv"]  # NVMe burst buffer; also serves as _postproc_venv (list each venv once)

# --- Solver command ---
_script = """\
export OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1 && \
source ${_solver_dir}/.venv/bin/activate && \
python3 ${_solver_dir}/nozzle_1d_solver.py\
"""
_case_postproc = """\
source ${_postproc_venv}/bin/activate && \
python3 ${_harvester_dir}/fvm_euler_1d_solver_harvester.py\
"""
_inject_outdir = "-outdir"

# --- Solver parameters (identical to nov_pkgs and new_pkgs) ---
"-time_scheme" = "BDF1"
"-linsolver" = "HHL"
"-cfl" = 1e10
"-iters" = 15
"-initers" = 1
"-restol" = 1e-2
"-tol" = 1e-10
"-localdt" = true
"-noshow" = true


[exact_nelem34]
"-nelem" = [3, 4]
"-shots" = 0
