# RERUN of the shot cases that crashed in the 2026-11-11 latest_pkgs sweep (../2026-11-11/_ea180c7c).
#
# 6 of the 70 shot cases died with numpy LinAlgError (Singular matrix / infs or NaNs):
#   5,000 shots x2 (trial_2, trial_4), 10,000 shots x2 (trial_3, trial_5), 50,000 shots x2 (trial_0, trial_2).
# This file runs 5 fresh trials at each of those three shot counts (15 cases) so every shot count can reach
# 10 complete trials with room for further crashes. Same solver commit, packages, HHL library and flags as
# fvm_main_latestpkgs.toml; only the groups and the output dir differ.
#
# These are NEW random draws, not reproductions of the crashed cases: HHL on main has no -seed option.
# Report the original 6/70 crash rate alongside any figure that fills the gaps with these.
#
# Run from the workspace root (all paths are cwd-relative), same venv/worktree as the original sweep
# (see README.md in this directory for setup):
#   q8020-sweep q8020-cfd-experiments/results/fvm_euler_1d_solver/nov2025-rerun/latest_pkgs/fvm_main_latestpkgs_rerun.toml --dry-run
#   # expect 15 cases in 3 groups
#   q8020-sweep <this toml>
#
[global]
_output_dir = "/lustre/orion/ard189/proj-shared/ishangore/nov2025-rerun/latest_pkgs_rerun"

# --- Paths (override with --set for different layouts) ---
_solver_dir = "./fvm_euler_1d_solver-main-latestpkgs"
_harvester_dir = "./q8020-cfd-experiments-aux/fvm_euler_1d_nozzle/fvm_euler_1d_nozzle"
_postproc_venv = "./fvm_euler_1d_solver-main-latestpkgs/.venv"

# --- SLURM ---
# Cases are single-core; pack 56 per node (15 cases -> 1 node).
# new_pkgs cases took ~1.5 h; same walltime budget here.
_slurm = true
_run_mode = "parallel"
_slurm_project = "ard189"
_slurm_partition = "extended"
_slurm_walltime = "08:00:00"
_slurm_exclusive_node = false
_slurm_cores_per_task = 1
_slurm_cores_per_node = 56
_slurm_pack_venvs = ["${_solver_dir}/.venv"]  # NVMe burst buffer; also serves as _postproc_venv (list each venv once)

# --- Solver command ---
_script = """\
export OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1 && \
source ${_solver_dir}/.venv/bin/activate && \
python3 ${_solver_dir}/nozzle_1d_solver.py\
"""
_case_postproc = """\
source ${_postproc_venv}/bin/activate && \
python3 ${_harvester_dir}/fvm_euler_1d_solver_harvester.py\
"""
_inject_outdir = "-outdir"

# --- Solver parameters (identical to nov_pkgs and new_pkgs) ---
"-nelem" = 5
"-time_scheme" = "BDF1"
"-linsolver" = "HHL"
"-cfl" = 1e10
"-iters" = 15
"-initers" = 1
"-restol" = 1e-2
"-tol" = 1e-10
"-localdt" = true
"-noshow" = true


[rerun_5000]
"-shots" = 5000
"_trials" = 5

[rerun_10000]
"-shots" = 10000
"_trials" = 5

[rerun_50000]
"-shots" = 50000
"_trials" = 5
