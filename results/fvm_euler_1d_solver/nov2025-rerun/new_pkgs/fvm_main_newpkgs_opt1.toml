# VARIANT of fvm_main_newpkgs.toml: transpiler optimization level forced to 1 via
# QISKIT_SETTINGS=qiskit_opt1.conf (qiskit 2.5.2; default there is 2).
# Everything else is identical to fvm_main_newpkgs.toml. Only _output_dir, _qiskit_settings
# and the QISKIT_SETTINGS export in _script differ. The level is NOT recorded in
# metadata beyond this TOML and the command string; the .conf file holds it.
#
# Current fvm main on its OWN (current) package stack, same case as the
# 2025-11-11 baseline and the ../nov_pkgs rerun.
#
# nelem=5 nozzle, HHL on the ideal statevector simulator:
#   exact  : shots=0, 1 case
#   shots  : 7 shot counts x 10 trials = 70 cases
#
# Code: fvm_euler_1d_solver main at ef7f0a8b (the commit ../nov_pkgs ran),
# checked out as a worktree at ./fvm_euler_1d_solver-main-newpkgs, venv from
# requirements.newpkgs.txt (Python 3.12, qiskit 2.5.2 = main's uv.lock).
# Everything else is identical to ../nov_pkgs/fvm_main_novpkgs.toml, so
# nov_pkgs vs this sweep isolates the package change (qiskit 1.2.4 -> 2.5.2).
# HHL on main has no -seed option, so shot trials are unseeded, as in nov_pkgs.
# See README.md in this directory for setup.
#
# Run from the workspace root (all paths are cwd-relative):
#   q8020-sweep q8020-cfd-experiments/results/fvm_euler_1d_solver/nov2025-rerun/new_pkgs/fvm_main_newpkgs.toml --dry-run
#
# Check the exact case first (group `exact`): converges in 7 iterations,
# residual ~8.9e-11, Mach [1.5204, 2.1516]. Transpiled depth is expected to
# DIFFER from nov_pkgs' 689027 (qiskit 2.x compiles differently).

[global]
_output_dir = "/lustre/orion/ard189/proj-shared/ishangore/nov2025-rerun/new_pkgs_opt1"
_qiskit_settings = "./q8020-cfd-experiments/results/fvm_euler_1d_solver/nov2025-rerun/new_pkgs/qiskit_opt1.conf"

# --- Paths (override with --set for different layouts) ---
_solver_dir = "./fvm_euler_1d_solver-main-newpkgs"
_harvester_dir = "./q8020-cfd-experiments-aux/fvm_euler_1d_nozzle/fvm_euler_1d_nozzle"
_postproc_venv = "./fvm_euler_1d_solver-main-newpkgs/.venv"

# --- SLURM ---
# Cases are single-core; pack 56 per node (71 cases -> 2 nodes).
# nov_pkgs cases took up to ~2 h; qiskit 2.x should be faster.
_slurm = true
_run_mode = "parallel"
_slurm_project = "ard189"
_slurm_partition = "extended"
_slurm_walltime = "08:00:00"
_slurm_exclusive_node = false
_slurm_cores_per_task = 1
_slurm_cores_per_node = 56
_slurm_pack_venvs = ["${_solver_dir}/.venv"]  # NVMe burst buffer; also serves as _postproc_venv (list each venv once)

# --- Solver command ---
_script = """\
export QISKIT_SETTINGS=${_qiskit_settings} && \
export OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1 && \
source ${_solver_dir}/.venv/bin/activate && \
python3 ${_solver_dir}/nozzle_1d_solver.py\
"""
_case_postproc = """\
source ${_postproc_venv}/bin/activate && \
python3 ${_harvester_dir}/fvm_euler_1d_solver_harvester.py\
"""
_inject_outdir = "-outdir"

# --- Solver parameters (identical to nov_pkgs) ---
"-nelem" = 5
"-time_scheme" = "BDF1"
"-linsolver" = "HHL"
"-cfl" = 1e10
"-iters" = 15
"-initers" = 1
"-restol" = 1e-2
"-tol" = 1e-10
"-localdt" = true
"-noshow" = true


[exact]
"-shots" = 0

[shots]
"-shots" = [500, 1000, 5000, 10000, 50000, 100000, 150000]
"_trials" = 10
